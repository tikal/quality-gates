[project]
name = "quality-gates"
version = "0.1.0"
description = "Repository-agnostic code quality gates, run as pre-commit hooks"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Paul Soares" }]
dependencies = ["tree-sitter-language-pack==1.15.8", "tree-sitter==0.25.2"]

[project.urls]
Homepage = "https://github.com/tikal/quality-gates"
Repository = "https://github.com/tikal/quality-gates"
Issues = "https://github.com/tikal/quality-gates/issues"

[project.scripts]
check-inline-comments = "quality_gates.inline_comments:main"
dict-param-check = "quality_gates.dict_params:main"
check-marker-budget = "quality_gates.marker_budget:main"
check-dead-code = "quality_gates.dead_code:main"
check-forbidden-mocks = "quality_gates.forbidden_mocks:main"
check-pytest-describe = "quality_gates.pytest_describe:main"
check-hook-scope-contract = "quality_gates.hook_scope:main"
check-manifest-audit-coverage = "quality_gates.manifest_audit_coverage:main"
check-dockerfile-enrollment = "quality_gates.dockerfile_enrollment:main"
check-marker-preservation = "quality_gates.marker_preservation:main"
check-generated-artifact-freshness = "quality_gates.generated_artifacts:main"
check-downloaded-asset-enrollment = "quality_gates.downloaded_assets:main"
check-vulnerability-exceptions = "quality_gates.vulnerability_exceptions:main"
check-container-image-cves = "quality_gates.container_image_cves:main"
check-container-image-enrollment = "quality_gates.container_image_enrollment:main"
check-container-image-immutable-assessment = "quality_gates.container_immutable_assessment:main"
check-base-image-eol = "quality_gates.base_image_eol:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quality_gates"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = ["E", "W", "F", "I", "B", "C4", "UP", "C901", "PLR0904", "PLR0913", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-statements = 50
max-public-methods = 20
