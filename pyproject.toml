[project]
name = "quality-gates"
version = "0.1.0"
description = "Repository-agnostic code quality gates, run as pre-commit hooks"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Paul Soares" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/tikal/quality-gates"
Repository = "https://github.com/tikal/quality-gates"
Issues = "https://github.com/tikal/quality-gates/issues"

[project.scripts]
check-inline-comments = "quality_gates.inline_comments:main"
dict-param-check = "quality_gates.dict_params:main"
check-marker-budget = "quality_gates.marker_budget:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quality_gates"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = ["E", "W", "F", "I", "B", "C4", "UP", "C901", "PLR0904", "PLR0913", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-statements = 50
max-public-methods = 20
