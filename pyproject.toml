[project]
name = "quality-gates"
version = "0.1.0"
description = "Repository-agnostic code quality gates, run as pre-commit hooks"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
check-inline-comments = "quality_gates.inline_comments:main"
dict-param-check = "quality_gates.dict_params:main"
check-marker-budget = "quality_gates.marker_budget:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quality_gates"]

[tool.ruff]
target-version = "py311"
line-length = 120
fix = true

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "C901", "PLR0913", "PLR0915"]
