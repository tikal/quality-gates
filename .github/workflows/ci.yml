name: ci

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5

      - name: install
        run: |
          uv venv
          uv pip install --python .venv/bin/python -e .

      - name: tests
        run: PATH="$PWD/.venv/bin:$PATH" bash tests/run_tests.sh

      - name: ruff check
        run: uvx ruff@0.15.5 check --no-fix .

      - name: ruff format
        run: uvx ruff@0.15.5 format --check .
