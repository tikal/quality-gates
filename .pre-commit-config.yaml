repos:
  - repo: .
    rev: HEAD
    hooks:
      - id: check-inline-comments
        args: [--no-baseline, src, tests]
      - id: dict-param-check
        args: [src, tests]
      - id: check-marker-budget
        args: [--ceiling, "0"]
      - id: check-dead-code
        args: [--path, src, --path, tests, --min-confidence, "80"]
      - id: check-duplication
        args: [--root, ., --format, "python,bash,javascript", --ext, '\.(py|sh|js)$', --min-lines, "5", --min-tokens, "50", --select, tree, --threshold, "0", --comment-prefix, //, --strict-scope]
