- id: check-inline-comments
  name: check inline comments and docstrings
  description: Fail on a plain inline comment, an over-long marker block, or a docstring on a private function.
  entry: check-inline-comments
  language: python
  types: [python]
  args: [--baseline, .quality/inline-comments.txt]
  pass_filenames: false
  require_serial: true

- id: dict-param-check
  name: check dict type annotations in public signatures
  description: Fail on an anonymous dict, Mapping, or MutableMapping shape in a public signature.
  entry: dict-param-check
  language: python
  types: [python]
  args: []
  pass_filenames: false
  require_serial: true

- id: check-marker-budget
  name: marker budget
  description: Cap the number of TODO/FIXME/NOTE marker blocks a repository may hold.
  entry: check-marker-budget
  language: python
  always_run: true
  args: [--ceiling, "0"]
  pass_filenames: false
  require_serial: true

- id: check-dead-code
  name: check dead Python code
  description: Fail when Vulture finds unused code in hook-declared paths. Consumer [tool.vulture] settings are ignored.
  entry: check-dead-code
  language: python
  additional_dependencies: [vulture==2.14.0]
  args: [--path, src, --path, tests, --min-confidence, "80"]
  pass_filenames: false
  require_serial: true

- id: check-duplication
  name: check copy-paste duplication
  description: Fail when jscpd finds a clone or reads less than the declared strict scope.
  entry: check-duplication
  language: node
  additional_dependencies: [jscpd@5.0.16]
  args: [--root, ., --format, "python,bash", --ext, '\.(py|sh)$', --min-lines, "5", --min-tokens, "50", --select, tree, --threshold, "0", --strict-scope]
  pass_filenames: false
  require_serial: true
