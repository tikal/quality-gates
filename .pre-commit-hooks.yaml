- id: check-inline-comments
  name: check inline comments and docstrings
  description: Fail on a plain comment, an over-long marker block or module docstring, or a docstring on a private function.
  entry: check-inline-comments
  language: python
  types: [python]
  args: [--baseline, .quality/inline-comments.txt]
  pass_filenames: false
  require_serial: true

- id: dict-param-check
  name: check dict type annotations in public signatures
  description: Fail on an anonymous dict, Mapping, or MutableMapping shape in a public signature. A baseline ratchets existing debt.
  entry: dict-param-check
  language: python
  types: [python]
  args: [--baseline, .quality/dict-params.txt]
  pass_filenames: false
  require_serial: true

- id: check-marker-budget
  name: marker budget
  description: Cap the number of TODO/FIXME/NOTE/HACK/XXX marker blocks a repository may hold.
  entry: check-marker-budget
  language: python
  always_run: true
  args: [--ceiling, "0"]
  pass_filenames: false
  require_serial: true

- id: check-marker-preservation
  name: check staged marker preservation
  description: Opt in to prevent staged source changes from deleting marker headers.
  entry: check-marker-preservation
  language: python
  stages: [pre-commit]
  files: '\.(py|ts|tsx|js|jsx|mjs|go|sh)$'
  pass_filenames: false
  require_serial: true

- id: check-generated-artifact-freshness
  name: check generated artifact freshness
  description: Opt in to verify deterministic generated artifacts against the staged index.
  entry: check-generated-artifact-freshness
  language: python
  stages: [pre-commit]
  always_run: true
  pass_filenames: false
  require_serial: true

- id: check-dead-code
  name: check dead Python code
  description: Fail when Vulture finds unused code in hook-declared paths. Consumer [tool.vulture] settings are ignored.
  entry: check-dead-code
  language: python
  additional_dependencies: [vulture==2.14.0]
  args: [--path, src, --path, tests, --min-confidence, "80"]
  pass_filenames: false
  require_serial: true

- id: check-forbidden-mocks
  name: check forbidden test mocks
  description: Opt in to forbid Mock, patch, and monkeypatch. Set --factory-location to name the approved test-double factory.
  entry: check-forbidden-mocks
  language: python
  types: [python]
  pass_filenames: false
  require_serial: true

- id: check-pytest-describe
  name: check pytest-describe test hierarchy
  description: Opt in to require describe, scenario, precondition, and leaf-test nesting for pytest-describe tests.
  entry: check-pytest-describe
  language: python
  types: [python]
  pass_filenames: false
  require_serial: true

- id: check-hook-scope-contract
  name: check pre-commit hook scope contract
  description: Opt in to require every configured hook to report scope=N or carry a reviewed exemption.
  entry: check-hook-scope-contract
  language: python
  always_run: true
  pass_filenames: false
  require_serial: true

- id: check-manifest-audit-coverage
  name: check dependency manifest audit coverage
  description: Opt in to require every declared dependency manifest to match an audit hook or reviewed exemption.
  entry: check-manifest-audit-coverage
  language: python
  always_run: true
  pass_filenames: false
  require_serial: true

- id: check-dockerfile-enrollment
  name: check Dockerfile scan enrollment
  description: Opt in to require every tracked Dockerfile to have a reviewed pull, build, or ignore classification.
  entry: check-dockerfile-enrollment
  language: python
  always_run: true
  pass_filenames: false
  require_serial: true

- id: check-duplication
  name: check copy-paste duplication
  description: Fail when jscpd finds a clone or reads less than the declared strict scope.
  entry: check-duplication
  language: node
  additional_dependencies: [jscpd@5.0.16]
  args: [--root, ., --format, "python,bash", --ext, '\.(py|sh)$', --min-lines, "5", --min-tokens, "50", --select, tree, --threshold, "0", --strict-scope]
  pass_filenames: false
  require_serial: true
